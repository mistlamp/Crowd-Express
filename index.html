<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crowd-Express</title><style>body{margin:0;background:#10131a;color:#fff;font-family:system-ui;text-align:center}main{max-width:900px;margin:auto;padding:32px 16px}canvas{width:100%;max-width:800px;background:#202633;border-radius:16px;touch-action:none}button{font-size:18px;padding:10px 24px;border:0;border-radius:10px;cursor:pointer}</style></head><body><main><h1>🚇 Crowd-Express</h1><p>승객을 안전하게 목적지까지 보내는 미니게임</p><canvas id="game" width="800" height="500"></canvas><p><button id="start">게임 시작</button></p><p id="info">START를 눌러 시작하세요.</p></main><script>const c=document.getElementById('game'),x=c.getContext('2d');let running=false,score=0,people=[];function draw(){x.clearRect(0,0,c.width,c.height);x.fillStyle='#39445a';x.fillRect(0,390,800,110);x.fillStyle='#e9c46a';x.fillRect(0,440,800,8);people.forEach(p=>{x.fillStyle=p.done?'#65d6a0':'#ff8fab';x.beginPath();x.arc(p.x,p.y,16,0,Math.PI*2);x.fill()});x.fillStyle='#fff';x.font='24px system-ui';x.fillText('SCORE: '+score,20,40);if(!running){x.font='28px system-ui';x.fillText('Crowd-Express',310,240)}}function spawn(){if(!running)return;people.push({x:Math.random()*700+50,y:360,done:false});setTimeout(spawn,900)}c.addEventListener('pointerdown',e=>{if(!running)return;const r=c.getBoundingClientRect(),mx=(e.clientX-r.left)*800/r.width,my=(e.clientY-r.top)*500/r.height;for(const p of people){if(!p.done&&Math.hypot(p.x-mx,p.y-my)<28){p.done=true;score+=10}}});document.getElementById('start').onclick=()=>{running=true;score=0;people=[];document.getElementById('info').textContent='승객을 클릭해서 열차에 태우세요!';spawn()};setInterval(()=>{if(running){people=people.filter(p=>!p.done);draw()}},100);draw();</script></body></html>
